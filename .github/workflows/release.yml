name: release

# Push a tag like v0.4.0: tests run, then the desktop app (Windows installer, macOS .dmg) and the
# command-line agent-duo are built and attached to a draft release.
on:
  push:
    tags: ["v*"]
  # Or run it by hand for a tag that already exists (builds the current branch, attaches to that tag).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.4.0
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            cli: agent-duo.exe
            cli_name: agent-duo-windows-x64.exe
          - os: macos-latest
            args: --target universal-apple-darwin
            cli: agent-duo
            cli_name: agent-duo-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      # npm install, not npm ci: newer npm rejects the Windows-made lockfile (it omits the
      # @emnapi peers of the bundler's wasm build, which no platform here installs).
      - name: Install
        run: |
          npm install --no-audit --no-fund --prefix web
          npm install --no-audit --no-fund --prefix desktop
          npm run build --prefix web
      - name: Test
        run: cargo test --workspace
      - name: Command-line agent-duo
        shell: bash
        run: |
          cargo build --release -p agent-duo
          mkdir -p out && cp target/release/${{ matrix.cli }} out/${{ matrix.cli_name }}
      - name: Desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing for macOS: set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID as repository secrets. Without them the app is unsigned.
        with:
          projectPath: desktop
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Agent Duo ${{ inputs.tag || github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: out/*
