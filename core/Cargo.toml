[package]
name = "duo-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
globset = "0.4.21"
indexmap = { version = "2.14.2", features = ["serde"] }
process-wrap = { version = "10.0.1", features = ["tokio1", "job-object", "process-group", "kill-on-drop"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
ts-rs = { version = "12.0.1", features = ["serde-compat", "indexmap-impl"] }
uuid = { version = "1.29.2", features = ["v4"] }

[target."cfg(windows)".dependencies]
junction = "2.1.0"
