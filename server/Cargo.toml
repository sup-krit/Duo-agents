[package]
name = "agent-duo"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
duo-core = { version = "0.4.0", path = "../core" }
futures-util = "0.3.34"
indexmap = "2.14.2"
open = "5.4.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "3.10.0", features = ["server", "transport-io"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[build-dependencies]
winresource = "0.1.34"
